---
layout: default
---

<article class="post">
  <header class="post-meta">
    <p class="fm">---</p>
    <h1 class="post-title"><span class="fm-key">title:</span> {{ page.title }}</h1>
    {% if page.date %}
    <p><span class="fm-key">date:</span> <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time></p>
    {% endif %}
    {% if page.tags and page.tags.size > 0 %}
    <p><span class="fm-key">tags:</span> [{{ page.tags | join: ', ' }}]</p>
    {% endif %}
    <p class="fm">---</p>
  </header>

  {{ content }}
</article>
